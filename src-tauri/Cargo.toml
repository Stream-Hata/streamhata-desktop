[package]
name = "nameless-streamhata-desktop"
version = "0.7.43-pre-alpha"
description = "Nameless StreamHata desktop shell"
edition = "2021"
license = "MIT"

[lib]
name = "nameless_streamhata_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tracing = "0.1"
open = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
sysinfo = "0.39"
tiny_http = "0.12"

tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
nvml-wrapper = "0.13"
gtk = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
wmi = "0.17"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }
