<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Что нового · Nameless StreamHata</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body { display: grid; place-items: center; min-height: 100vh; padding: 20px; background: radial-gradient(700px 420px at 20% 0%, #2b1128, #0f0817 70%); color: #f5eaff; }
      .card { width: min(680px, 100%); max-height: calc(100vh - 40px); overflow: auto; padding: 24px; border: 1px solid #3b214d; border-radius: 18px; background: #180e26f2; box-shadow: 0 28px 90px #0008; }
      .eyebrow { color: #ff2ea6; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 6px 0 10px; font-size: 26px; }
      h2 { margin: 18px 0 6px; font-size: 16px; color: #ff9bd5; }
      h3 { margin: 14px 0 6px; font-size: 13px; color: #b9a8cf; text-transform: uppercase; letter-spacing: .08em; }
      ul { display: flex; gap: 7px; flex-direction: column; margin: 6px 0 14px; padding-left: 20px; color: #d8c8ea; line-height: 1.45; }
      li::marker { color: #ff2ea6; }
      a { color: #ff9bd5; }
      .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 20px; }
      button { padding: 10px 15px; border: 0; border-radius: 9px; background: #ff2ea6; color: #0f0817; font: inherit; font-weight: 800; cursor: pointer; }
      .version { padding: 10px 0; border-top: 1px solid #3b214d; }
      .version:first-of-type { border-top: 0; }
      .version-date { margin-left: 8px; color: #8d76a6; font-size: 11px; }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="eyebrow">Обновление</span>
      <h1>Что нового</h1>
      <div id="versions"><p>Загружаем изменения…</p></div>
      <div class="actions">
        <button id="close" type="button">Продолжить</button>
      </div>
    </main>
    <script>
      const invoke = (command) => window.__TAURI__.core.invoke(command);
      const escape = (value) => String(value).replace(/[<>&]/g, (char) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[char]));

      async function load() {
        try {
          const response = await fetch('changelog.json?t=' + Date.now());
          const versions = await response.json();
          document.getElementById('versions').innerHTML = versions.map((entry) => `
            <section class="version">
              <h2>Версия ${escape(entry.version)}<span class="version-date">${escape(entry.date || '')}</span> <a href="https://github.com/p7x-dev/rgg-inventory-2/commits/main" target="_blank" rel="noopener">Коммиты</a></h2>
              ${(entry.sections || []).map((section) => `
                <h3>${escape(section.title)}</h3>
                <ul>${(section.items || []).map((item) => `<li>${escape(item.text)}${item.url ? ` <a href="${escape(item.url)}" target="_blank" rel="noopener">${escape(item.linkLabel || 'commit')}</a>` : ''}</li>`).join('')}</ul>
              `).join('')}
            </section>
          `).join('');
        } catch {
          document.getElementById('versions').innerHTML = '<p>Не удалось загрузить список изменений. Проверьте соединение.</p>';
        }
      }

      document.getElementById('close').addEventListener('click', () => {
        invoke('finish_changelog').catch(() => window.close());
      });
      load();
    </script>
  </body>
</html>
