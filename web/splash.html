<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { display: grid; place-items: center; background: radial-gradient(420px 260px at 30% 0%, #35142d, #0f0817 70%); color: #f5eaff; }
      .wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }
      .spinner { width: 34px; height: 34px; border: 3px solid #3b214d; border-top-color: #ff2ea6; border-radius: 50%; animation: spin .8s linear infinite; }
      .title { font-size: 16px; font-weight: 700; letter-spacing: .02em; }
      .hint { font-size: 11px; color: #b9a8cf; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spinner"></div>
      <div class="title">Nameless StreamHata</div>
      <div class="hint">Загружаем панель…</div>
    </div>
  </body>
</html>
