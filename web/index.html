<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Nameless StreamHata</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(900px 500px at 20% 0%, #2a0d25, #0f0817 60%); color: #f5eaff; }
      main { width: min(420px, calc(100vw - 40px)); padding: 32px; border: 1px solid #3b214d; border-radius: 18px; background: #180e26; box-shadow: 0 24px 80px #0008; }
      h1 { margin: 0 0 8px; font-size: 28px; }
      p { color: #b9a8cf; line-height: 1.5; }
      button { width: 100%; margin-top: 18px; padding: 14px; border: 0; border-radius: 10px; background: #ff2ea6; color: #0f0817; font-weight: 800; font-size: 15px; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      small { display: block; margin-top: 16px; color: #6f5b87; }
    </style>
  </head>
  <body>
    <main>
      <h1>Nameless StreamHata</h1>
      <p>Вход в desktop-приложение через Twitch. Пароль вводится в системном браузере, токен сохраняется в OS keychain.</p>
      <button id="login" type="button">Войти через Twitch</button>
      <small id="status">Готово к входу</small>
    </main>
    <script>
      const button = document.getElementById('login');
      const status = document.getElementById('status');
      async function resume() {
        try {
          const restored = await window.__TAURI__.core.invoke('resume_session');
          if (restored) {
            status.textContent = 'Восстанавливаем сессию…';
            button.disabled = true;
            return;
          }
        } catch (error) {
          console.error(error);
        }
        status.textContent = 'Готово к входу';
      }

      button.addEventListener('click', async () => {
        button.disabled = true;
        status.textContent = 'Открываем браузер…';
        try {
          await window.__TAURI__.core.invoke('start_desktop_login');
          status.textContent = 'Завершите вход в браузере и вернитесь сюда.';
        } catch (error) {
          button.disabled = false;
          status.textContent = String(error);
        }
      });

      resume();
    </script>
  </body>
</html>
