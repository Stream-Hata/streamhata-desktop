name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python3 scripts/set-version.py "${GITHUB_REF_NAME#v}"

      - name: Prepare updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key="${TAURI_SIGNING_PRIVATE_KEY:-}"
          if [ -z "$key" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not configured"
            exit 1
          fi
          work="$RUNNER_TEMP/updater"
          mkdir -p "$work"
          raw="$work/updater.raw"
          encoded="$work/updater.key"
          if [[ "$key" == *"untrusted comment"* ]]; then
            if [[ "$key" == *'\n'* && "$key" != *$'\n'* ]]; then
              printf '%b\n' "$key" > "$raw"
            else
              printf '%s\n' "$key" > "$raw"
            fi
            base64 -w0 "$raw" > "$encoded"
          else
            printf '%s' "$key" | tr -d '\r\n' > "$encoded"
          fi
          base64 -d "$encoded" | head -n 1 | grep -q "untrusted comment" || {
            echo "::error::Updater key is invalid: expected base64-encoded Tauri updater key"
            exit 1
          }
          echo "TAURI_SIGNING_PRIVATE_KEY=$(cat "$encoded")" >> "$GITHUB_ENV"
          echo "Prepared updater key: $(wc -c < "$encoded") bytes (base64)"

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          args: --bundles nsis,msi
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('StreamHata {0}', github.ref_name) || '' }}
          releaseDraft: false
          prerelease: false

      - name: Generate updater manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          artifact=$(find . -type f \( -name '*.nsis.zip' -o -name '*.msi' \) -print -quit)
          signature="$artifact.sig"
          test -n "$artifact"
          test -f "$signature"
          python3 scripts/generate-latest.py             --version "$version"             --tag "$GITHUB_REF_NAME"             --repo "$GITHUB_REPOSITORY"             --platform windows-x86_64             --artifact "$artifact"             --signature "$signature"

      - name: Verify manifest artifact
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          url=$(python3 -c "import json; print(json.load(open('latest.json'))['platforms'][next(iter(json.load(open('latest.json'))['platforms']))]['url'])")
          curl -fsIL --retry 5 --retry-delay 3 "$url" >/dev/null

      - name: Upload updater manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" latest.json --clobber
