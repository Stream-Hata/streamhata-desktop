name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Prepare updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key="${TAURI_SIGNING_PRIVATE_KEY:-}"
          if [ -z "$key" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not configured"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/updater"
          keyfile="$RUNNER_TEMP/updater/updater.key"
          if [[ "$key" == *"untrusted comment"* ]]; then
            if [[ "$key" == *'\n'* && "$key" != *$'\n'* ]]; then
              printf '%b\n' "$key" > "$keyfile"
            else
              printf '%s\n' "$key" > "$keyfile"
            fi
          else
            printf '%s' "$key" | base64 -d > "$keyfile"
          fi
          head -n 1 "$keyfile" | grep -q "untrusted comment" || {
            echo "::error::Updater key is invalid: missing untrusted comment line"
            exit 1
          }
          echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$keyfile" >> "$GITHUB_ENV"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<__STREAMHATA_KEY__"
            cat "$keyfile"
            echo "__STREAMHATA_KEY__"
          } >> "$GITHUB_ENV"

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          args: --bundles nsis,msi
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('StreamHata {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
