name: Release Linux

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python3 scripts/set-version.py "${GITHUB_REF_NAME#v}"

      - name: Prepare updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key="${TAURI_SIGNING_PRIVATE_KEY:-}"
          if [ -z "$key" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not configured"
            exit 1
          fi
          work="$RUNNER_TEMP/updater"
          mkdir -p "$work"
          raw="$work/updater.raw"
          encoded="$work/updater.key"
          if [[ "$key" == *"untrusted comment"* ]]; then
            if [[ "$key" == *'\n'* && "$key" != *$'\n'* ]]; then
              printf '%b\n' "$key" > "$raw"
            else
              printf '%s\n' "$key" > "$raw"
            fi
            base64 -w0 "$raw" > "$encoded"
          else
            printf '%s' "$key" | tr -d '\r\n' > "$encoded"
          fi
          base64 -d "$encoded" | head -n 1 | grep -q "untrusted comment" || {
            echo "::error::Updater key is invalid: expected base64-encoded Tauri updater key"
            exit 1
          }
          echo "TAURI_SIGNING_PRIVATE_KEY=$(cat "$encoded")" >> "$GITHUB_ENV"
          echo "Prepared updater key: $(wc -c < "$encoded") bytes (base64)"

      - name: Build and bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx -y @tauri-apps/cli@2 build --bundles appimage,deb

      - name: Normalize bundle names
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          mkdir -p normalized
          cp "$(find target -type f -name '*.AppImage' -print -quit)" "normalized/StreamHata_${version}_amd64.AppImage"
          cp "$(find target -type f -name '*.AppImage.sig' -print -quit)" "normalized/StreamHata_${version}_amd64.AppImage.sig"
          cp "$(find target -type f -name '*.deb' -print -quit)" "normalized/StreamHata_${version}_amd64.deb"
          cp "$(find target -type f -name '*.deb.sig' -print -quit)" "normalized/StreamHata_${version}_amd64.deb.sig"

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: python3 scripts/release-notes.py "$GITHUB_REF_NAME" > release-notes.md

      - name: Publish release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "StreamHata $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
          find normalized -type f -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber

      - name: Generate updater manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          artifact=$(find normalized -type f -name '*.AppImage' -print -quit)
          signature="$artifact.sig"
          test -n "$artifact"
          test -f "$signature"
          python3 scripts/generate-latest.py             --version "$version"             --tag "$GITHUB_REF_NAME"             --repo "$GITHUB_REPOSITORY"             --platform linux-x86_64             --artifact "$artifact"             --signature "$signature"

      - name: Verify manifest artifact
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          url=$(python3 -c "import json; print(json.load(open('latest.json'))['platforms'][next(iter(json.load(open('latest.json'))['platforms']))]['url'])")
          curl -fsIL --retry 5 --retry-delay 3 "$url" >/dev/null

      - name: Upload updater manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" latest.json --clobber

      - name: Attach changelog to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
