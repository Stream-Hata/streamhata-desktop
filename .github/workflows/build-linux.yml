name: Release Linux

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Prepare updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key="${TAURI_SIGNING_PRIVATE_KEY:-}"
          if [ -z "$key" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not configured"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/updater"
          keyfile="$RUNNER_TEMP/updater/updater.key"
          if [[ "$key" == *"untrusted comment"* ]]; then
            printf '%s\n' "$key" > "$keyfile"
          else
            printf '%s' "$key" | base64 -d > "$keyfile"
          fi
          head -n 1 "$keyfile" | grep -q "untrusted comment" || {
            echo "::error::Updater key is invalid: missing untrusted comment line"
            exit 1
          }
          echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$keyfile" >> "$GITHUB_ENV"

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          args: --bundles deb,appimage
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('StreamHata {0}', github.ref_name) || '' }}
          releaseDraft: false
          prerelease: false
